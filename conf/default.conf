# Public ingress only. Credentials pass through untouched, so Camouflare's own
# bearer token remains the gate. Header-less FlareSolverr clients do NOT come
# here: they use the shim on 8192 over the private network.
server {
    listen 8191;
    server_name _;

    client_max_body_size 64m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 240s;
    proxy_read_timeout 240s;

    location / {
        proxy_pass http://camouflare:8191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}
