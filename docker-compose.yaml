# Camouflare 2.1.0 — FlareSolverr-compatible browser service.
#
# Deployed by Coolify from this repo as a docker-compose resource.
# Domains are configured in Coolify (docker_compose_domains), which generates the
# Traefik routers. Do not hand-write routers here: they would collide.
#
#   public   https://camouflare.382972.xyz -> camouflare-auth:8191 -> camouflare:8191
#                                              (bearer token still enforced by the app)
#   private  camouflare-shim:8192          -> token injected, null proxy stripped
#                                              (for Prowlarr / Jackett)
#   public   https://prowlarr.382972.xyz   -> prowlarr:9696
#
# camouflare is deliberately NOT on the shared `coolify` bridge: that bridge
# carries ~50 other containers and this service fetches caller-supplied URLs, so
# sharing it let a token holder read http://coolify:8080. Only the ingress hop
# and Prowlarr join it, because Traefik routes to them.
services:
  camouflare:
    image: mehmetcansahin/camouflare:2.1.0
    restart: unless-stopped
    shm_size: "2gb"
    mem_limit: "6g"
    cpus: 2.0
    pids_limit: 1024
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    environment:
      HOST: "0.0.0.0"
      PORT: "8191"
      CAMOUFLARE_API_TOKEN: ${CAMOUFLARE_API_TOKEN}
      HEADLESS: virtual
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      POOL_MIN_BROWSERS: "2"
      POOL_MAX_BROWSERS: "2"
      POOL_MAX_CONTEXTS_PER_BROWSER: "1"
      POOL_RESERVED_TRANSIENT_CONTEXTS: "1"
      POOL_ACQUIRE_TIMEOUT_MS: "30000"
      CLEANUP_TIMEOUT_SECONDS: "10"
      READINESS_TIMEOUT_MS: "15000"
      PROMETHEUS_ENABLED: "true"
    expose: ["8191"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [arr]

  camouflare-auth:
    # Config is baked into the image: Coolify drops relative bind mounts, and the
    # stock nginx config would listen on :80 instead of :8191.
    build:
      context: ./conf
    image: camouflare-auth:local
    restart: unless-stopped
    depends_on: [camouflare]
    expose: ["8191"]
    networks: [arr, coolify]

  camouflare-shim:
    build:
      context: ./shim
    image: camouflare-shim:local
    restart: unless-stopped
    depends_on: [camouflare]
    environment:
      CAMOUFLARE_API_TOKEN: ${CAMOUFLARE_API_TOKEN}
      UPSTREAM: http://camouflare:8191
      PORT: "8192"
    expose: ["8192"]
    mem_limit: "128m"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [arr]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: America/New_York
    volumes:
      - /data/prowlarr/config:/config
    expose: ["9696"]
    networks: [arr, coolify]

networks:
  arr:
    driver: bridge
  coolify:
    external: true
    name: coolify
