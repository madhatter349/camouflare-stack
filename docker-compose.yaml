# Camouflare 2.1.0 — FlareSolverr-compatible browser service.
#
# Deployed by Coolify from this repo as a docker-compose resource.
#
#   public   https://camouflare.382972.xyz -> camouflare-auth:8191 -> camouflare:8191
#                                              (bearer token still enforced by the app)
#   private  camouflare-shim:8192          -> token injected, null proxy stripped
#                                              (for Prowlarr / Jackett)
#   public   https://prowlarr.382972.xyz   -> prowlarr:9696 (Traefik basic auth)
#
# camouflare is deliberately NOT on the `coolify` bridge. That bridge carries ~50
# other containers and this service fetches caller-supplied URLs, so sharing it
# let a token holder read http://coolify:8080. Only the ingress hop joins it.
services:
  camouflare:
    image: mehmetcansahin/camouflare:2.1.0
    restart: unless-stopped
    shm_size: "2gb"
    mem_limit: "6g"
    cpus: 2.0
    pids_limit: 1024
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    environment:
      HOST: "0.0.0.0"
      PORT: "8191"
      CAMOUFLARE_API_TOKEN: ${CAMOUFLARE_API_TOKEN}
      HEADLESS: virtual
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      POOL_MIN_BROWSERS: "2"
      POOL_MAX_BROWSERS: "2"
      POOL_MAX_CONTEXTS_PER_BROWSER: "1"
      POOL_RESERVED_TRANSIENT_CONTEXTS: "1"
      POOL_ACQUIRE_TIMEOUT_MS: "30000"
      CLEANUP_TIMEOUT_SECONDS: "10"
      READINESS_TIMEOUT_MS: "15000"
      PROMETHEUS_ENABLED: "true"
    expose: ["8191"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [arr]

  camouflare-auth:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [camouflare]
    volumes:
      - ./conf:/etc/nginx/templates:ro
    expose: ["8191"]
    networks: [arr, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.cf-http.entrypoints=http
      - traefik.http.routers.cf-http.rule=Host(`camouflare.382972.xyz`)
      - traefik.http.routers.cf-http.middlewares=cf-tohttps
      - traefik.http.middlewares.cf-tohttps.redirectscheme.scheme=https
      - traefik.http.routers.cf-https.entrypoints=https
      - traefik.http.routers.cf-https.rule=Host(`camouflare.382972.xyz`)
      - traefik.http.routers.cf-https.tls=true
      - traefik.http.routers.cf-https.tls.certresolver=letsencrypt
      - traefik.http.routers.cf-https.middlewares=cf-inflight
      - traefik.http.middlewares.cf-inflight.inflightreq.amount=4
      - traefik.http.routers.cf-https.service=cf-svc
      - traefik.http.services.cf-svc.loadbalancer.server.port=8191

  camouflare-shim:
    build:
      context: ./shim
    image: camouflare-shim:local
    restart: unless-stopped
    depends_on: [camouflare]
    environment:
      CAMOUFLARE_API_TOKEN: ${CAMOUFLARE_API_TOKEN}
      UPSTREAM: http://camouflare:8191
      PORT: "8192"
    expose: ["8192"]
    mem_limit: "128m"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [arr]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: America/New_York
    volumes:
      - /data/prowlarr/config:/config
    expose: ["9696"]
    networks: [arr, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.pl-http.entrypoints=http
      - traefik.http.routers.pl-http.rule=Host(`prowlarr.382972.xyz`)
      - traefik.http.routers.pl-http.middlewares=pl-tohttps
      - traefik.http.middlewares.pl-tohttps.redirectscheme.scheme=https
      - traefik.http.routers.pl-https.entrypoints=https
      - traefik.http.routers.pl-https.rule=Host(`prowlarr.382972.xyz`)
      - traefik.http.routers.pl-https.tls=true
      - traefik.http.routers.pl-https.tls.certresolver=letsencrypt
      - traefik.http.routers.pl-https.middlewares=pl-auth
      - traefik.http.middlewares.pl-auth.basicauth.users=${PROWLARR_BASIC_AUTH:?set PROWLARR_BASIC_AUTH in Coolify env}
      - traefik.http.routers.pl-https.service=pl-svc
      - traefik.http.services.pl-svc.loadbalancer.server.port=9696

networks:
  arr:
    driver: bridge
  coolify:
    external: true
    name: coolify
